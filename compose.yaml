services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sentinel -d sentinel]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports:
      - "127.0.0.1:5090:5090"
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@database:5432/sentinel
      SENTINEL_BOOTSTRAP_PASSWORD: ${SENTINEL_BOOTSTRAP_PASSWORD:?Set SENTINEL_BOOTSTRAP_PASSWORD in .env}
      SENTINEL_JWT_KEY: ${SENTINEL_JWT_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SENTINEL_PUBLIC_URL: ${SENTINEL_PUBLIC_URL:-}
      SENTINEL_ENV: development
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - app-data:/app/backend/data
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
  app-data:
