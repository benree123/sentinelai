name: Temporary lockfile update
on:
  push:
    branches: [fix/demo-reliability]
    paths: [.github/workflows/temp-update-lock.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/demo-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm audit fix && npm audit --audit-level=high
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-update-lock.yml
          git add frontend/package.json frontend/package-lock.json
          git commit -m "Update frontend dependencies to resolve npm audit advisories"
          git push
